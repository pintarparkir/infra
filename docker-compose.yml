# Shared local infra for ParkirPintar microservices.
#
# Brings up only the SUPPORTING services (postgres, redis, rabbitmq, otel-collector).
# Each Go service runs from its own directory: cd <service>; make run.
#
# Usage:
#   cd infra
#   docker compose up -d
#   docker compose down -v   # also wipes volumes
#
# Each microservice has its own database (created by ./postgres/init/00-create-databases.sql)
# so services stay isolated even though they share a single Postgres instance for dev.

services:
  postgres:
    image: postgres:16-alpine
    container_name: parkir-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: parkir-redis
    command: ["redis-server", "/etc/redis/redis.conf"]
    ports: ["6379:6379"]
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  # ── RabbitMQ note ──
  # The official rabbitmq Docker image's entrypoint chmods the Erlang cookie
  # to 0400 and loses access under rootless Podman on macOS (we tried tmpfs,
  # user:0:0, and env-var override — all hit `eacces` on .erlang.cookie).
  # Run RabbitMQ via Homebrew on the host instead:
  #
  #   brew install rabbitmq
  #   brew services start rabbitmq
  #
  # Services connect to localhost:5672 the same way as the compose-managed one.
  # On Linux hosts (CI, prod), uncomment the rabbitmq block above and use the
  # standard `rabbitmq:3.13-management-alpine` image directly.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: parkir-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "8889:8889"
    volumes:
      - ./otel/config.yaml:/etc/otelcol/config.yaml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: parkir-jaeger
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: parkir-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.1.0
    container_name: parkir-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    depends_on:
      - prometheus
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  prom_data:
  grafana_data:
