# RabbitMQ configuration for ParkirPintar.
# All durable resources (exchange, queues) are declared by services on connect.

loopback_users.guest = false
listeners.tcp.default = 5672
management.tcp.port = 15672

# Modest defaults for dev. In prod tune memory_high_watermark and disk_free_limit.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
