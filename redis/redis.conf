# Redis configuration tuned for ParkirPintar's lock + cache workload.
# Keep it small + non-persistent for MVP; in prod, enable AOF.

bind 0.0.0.0
port 6379
protected-mode no
maxmemory 256mb
maxmemory-policy allkeys-lru

# We treat Redis as cache + lock (durable storage is in Postgres).
# Disable persistence to keep ops simple. Loss of lock state is acceptable —
# the PG EXCLUDE constraint is the authoritative defense (see ADR-004).
save ""
appendonly no

tcp-keepalive 60
timeout 300
