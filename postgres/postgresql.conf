# Production-tuned subset — applied via container's --conf-file.
# (For docker-compose dev we use Postgres defaults; this file documents prod settings.)

max_connections = 100
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 64MB

# Logging — slow queries + lock waits make incident response actually feasible.
log_min_duration_statement = 200ms
log_lock_waits = on
log_checkpoints = on
log_connections = off
log_disconnections = off

# WAL — tune for write-heavy reservation workload.
wal_level = replica
max_wal_size = 1GB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9

# Vacuum — important for reservation table churn.
autovacuum = on
autovacuum_naptime = 30s
